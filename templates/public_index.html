<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Systems Over Chaos</title>
  <link rel="stylesheet" href="/static/site.css">
</head>
<body>
  <div class="container">
    <div class="nav">
      <div class="brand"><span class="status-dot"></span>Systems Over Chaos</div>
      <div><a href="/admin">Admin</a></div>
    </div>

    <div class="card">
      <div class="meta">Latest posts</div>
      <hr/>
      {% for p in posts %}
        <a class="log-row" href="/blog/{{ p.slug }}">
          <span class="log-row-title">{{ p.title }}</span>
          <span class="timestamp">{{ p.published_at }}</span>
        </a>
      {% endfor %}
      {% if posts.len() == 0 %}
        <div class="empty-state">No posts yet.</div>
      {% endif %}
    </div>
  </div>
</body>
</html>
