<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>{{ title }} · Systems Over Chaos</title>
  <link rel="stylesheet" href="/static/site.css">
</head>
<body>
  <div class="container">
    <header class="topbar">
      <a class="brand" href="/">Systems Over Chaos</a>
      <div class="meta">{{ published_at }}</div>
    </header>

    <main class="card">
      <h1 class="post-title">{{ title }}</h1>

      <div class="tag-row">
        {% for t in tags %}
          <span class="tag">{{ t }}</span>
        {% endfor %}
      </div>

      <div class="divider"></div>

      <article class="prose">
        {{ html }}
      </article>
    </main>

    <footer class="footer">
      <div class="meta">© Systems Over Chaos</div>
    </footer>
  </div>
</body>
</html>
