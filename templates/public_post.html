<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>{{ title }} · Systems Over Chaos</title>
  <link rel="stylesheet" href="/static/site.css">
</head>
<body>
  <div class="container">
    <div class="nav">
      <div class="brand"><a href="/" style="color:inherit;text-decoration:none;">Systems Over Chaos</a></div>
      <div class="meta">{{ published_at }}</div>
    </div>

    <div class="card">
      <h1 style="margin-top:0">{{ title }}</h1>
      <div>
        {% for t in tags %}
          <span class="tag">{{ t }}</span>
        {% endfor %}
      </div>
      <hr/>
      <article>
        {{ html }}
      </article>
    </div>
  </div>
</body>
</html>
