<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>{{ heading }} · Admin</title>
  <link rel="stylesheet" href="/static/site.css">
</head>
<body>
  <img class="site-logo-fixed" src="/static/logo.png" alt="Systems Over Chaos">
  <div class="container">
    <div class="nav">
      <div class="brand"><img class="site-logo" src="/static/logo.png" alt="Systems Over Chaos"><span class="status-dot"></span>{{ heading }}</div>
      <div><a href="{{ back_href }}">Back</a></div>
    </div>

    <form action="{{ action }}" method="post" id="post-form">
      <div class="card" style="margin-bottom:14px;">
        <div class="grid2">
          <div>
            <label class="meta field-label">Title</label>
            <input name="title" placeholder="Systems Over Chaos: ..." required value="{{ title }}">
          </div>
          <div>
            <label class="meta field-label">Slug</label>
            <input name="slug" placeholder="my-first-post" required value="{{ slug }}">
          </div>
        </div>

        <div class="grid2" style="margin-top:12px;">
          <div>
            <label class="meta field-label">Tags (comma separated)</label>
            <input name="tags" placeholder="rust, systems, notes" value="{{ tags }}">
          </div>
          <div>
            <label class="meta field-label">Status</label>
            <select name="status">
              <option value="draft" {% if status == "draft" %}selected{% endif %}>draft</option>
              <option value="published" {% if status == "published" %}selected{% endif %}>published</option>
            </select>
          </div>
        </div>
      </div>

      <div class="card" style="margin-bottom:14px;">
        <div class="grid2">
          <div>
            <div class="meta">Markdown</div>
            <hr/>
            <textarea id="md" class="md-editor" placeholder="# Write here...">{{ markdown }}</textarea>
          </div>
          <div>
            <div class="meta">Preview</div>
            <hr/>
            <div id="preview" class="prose">Start typing…</div>
          </div>
        </div>
      </div>

      <input type="hidden" name="markdown" id="markdown_hidden">

      <div class="card" style="display:flex; gap:10px; align-items:center; justify-content:space-between; flex-wrap:wrap;">
        <div style="display:flex; gap:10px; align-items:center; flex-wrap:wrap;">
          <label class="btn" style="cursor:pointer;">
            Upload image
            <input id="img_input" type="file" accept="image/*" style="display:none;">
          </label>
          <span class="meta" id="img_status"></span>
        </div>

        <div style="display:flex; gap:10px; align-items:center;">
          {% if is_edit %}
            <a class="btn" href="{{ view_href }}" target="_blank" rel="noopener">{{ view_label }}</a>
          {% endif %}
          <button class="btn btn-primary" type="submit">{{ submit_label }}</button>
        </div>
      </div>
    </form>
  </div>

<script>
const md = document.getElementById('md');
const preview = document.getElementById('preview');
const hidden = document.getElementById('markdown_hidden');
const form = document.getElementById('post-form');

async function refreshPreview() {
  const text = md.value;
  hidden.value = text;

  if (text.trim().length === 0) {
    preview.textContent = 'Start typing…';
    return;
  }

  const res = await fetch('/admin/preview', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ markdown: text })
  });

  if (!res.ok) {
    preview.textContent = 'Preview error';
    return;
  }
  const data = await res.json();
  preview.innerHTML = data.html;
}

let t = null;
md.addEventListener('input', () => {
  hidden.value = md.value;
  if (t) clearTimeout(t);
  t = setTimeout(refreshPreview, 300);
});

// keep the hidden field in sync even if the user submits before the
// debounce fires, or never touches the markdown field at all (edit mode)
form.addEventListener('submit', () => {
  hidden.value = md.value;
});

// pre-fill preview + hidden field on load (matters for edit mode)
hidden.value = md.value;
refreshPreview();

const imgInput = document.getElementById('img_input');
const imgStatus = document.getElementById('img_status');

imgInput.addEventListener('change', async () => {
  const file = imgInput.files?.[0];
  if (!file) return;

  imgStatus.textContent = 'Uploading...';
  const fd = new FormData();
  fd.append('file', file);

  const res = await fetch('/admin/upload-image', { method: 'POST', body: fd });
  const url = await res.text();

  if (!res.ok) {
    imgStatus.textContent = 'Upload failed: ' + url;
    return;
  }

  md.value += `\n\n![](${url})\n`;
  imgStatus.textContent = 'Uploaded: ' + url;
  refreshPreview();
});
</script>
</body>
</html>
